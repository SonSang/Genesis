# SHAC config for CartPoleSwingUp — matches NVlabs/DiffRL (ICLR'22)
# `examples/cfg/shac/cartpole_swing_up.yaml` 1:1 on every hyperparameter
# the Genesis port accepts.
#
# We previously shortened to H=8 + actor_lr=5e-4 to compensate for the
# noisier multi-step backward in Genesis's diffrigid solver; after the
# primal-consistency / split-cleanup chain (commits 423932f7, 9a36df6a,
# 58b41e6c, 656002c1 on this branch) the 32-step backward is byte-exact
# correct (`test_diff_forward_kinematics` + `test_diff_optim_trajectory_matching`),
# so we can run the paper setting verbatim.

env:
  name: CartPoleSwingUpEnv
  episode_length: 240
  stochastic_init: True

actor:
  units: [64, 64]
  activation: elu
  stochastic: True
  logstd_init: -1.0

critic:
  units: [64, 64]
  activation: elu

trainer:
  max_epochs: 500
  steps_num: 32
  num_actors: 64
  actor_lr: 0.01
  critic_lr: 0.001
  lr_schedule: linear
  betas: [0.7, 0.95]
  gamma: 0.99
  lam: 0.95
  grad_norm: 1.0
  truncate_grads: True
  critic_iterations: 16
  critic_method: td-lambda
  num_batch: 4
  target_critic_alpha: 0.2
  obs_rms: True
  save_interval: 100
  log_interval: 5
  eval_interval: 10      # record mp4 rollouts every N epochs (0 disables)
  eval_episodes: 5
  eval_video_fps: 60
  seed: 0
