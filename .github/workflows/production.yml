name: Production
on: [workflow_dispatch, pull_request]  # 편하게 수동 실행도 가능
jobs:
  fake-bench:
    runs-on: ubuntu-latest
    steps:
      - name: Make fake results
        run: |
          cat > speed_test_dummy.txt <<'TXT'
          env=cube#10 | batch_size=8192 | constraint_solver=CG | compile_time=50 | runtime_fps=100000 | realtime_factor=1000
          TXT
          cat > pr_comment.md <<'MD'
          :warning: **Benchmark regression detected (sandbox)**
          | test_id | current | baseline | delta |
          |---|---:|---:|---:|
          | cube#10... | 100,000 | 120,000 | -16.7% |
          MD
          echo '{}' > benchmark_comparison.json
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: speed-test-results
          path: |
            speed_test_dummy.txt
            benchmark_comparison.json
            pr_comment.md
